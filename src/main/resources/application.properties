# ===== HikariCP connection pool tuning =====
# Maximum pool size (default 10 — increase for production load)
spring.datasource.hikari.maximum-pool-size=20
# Minimum idle connections kept alive
spring.datasource.hikari.minimum-idle=5
# Max wait time for a connection (ms) — fail fast instead of hanging
spring.datasource.hikari.connection-timeout=10000
# Max lifetime of a connection in pool (ms) — recycle before DB kills it
spring.datasource.hikari.max-lifetime=600000
# Idle timeout (ms) — close connections idle for more than 5 min
spring.datasource.hikari.idle-timeout=300000
# Leak detection (ms) — log a warning if a connection is held > 30s
spring.datasource.hikari.leak-detection-threshold=30000

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT 鉴权配置。生产环境请通过环境变量或部署配置覆盖 secret。
