spring.datasource.url=jdbc:h2:mem:aitmk;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-h2
spring.task.scheduling.enabled=false
integration.schedulers-enabled=false
spring.main.allow-bean-definition-overriding=true
crm.bootstrap-enabled=false
security.jwt.secret=test-only-secret-that-is-at-least-32-bytes
